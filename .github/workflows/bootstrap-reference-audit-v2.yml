name: Bootstrap reference audit v2

on:
  push:
    paths:
      - .github/workflows/bootstrap-reference-audit-v2.yml
      - .seed-reference-audit-v2/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-reference-audit-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Apply, validate, and publish
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G '.seed-reference-audit-v2/part-*' >/dev/null; then
            echo "No seed payload; bootstrap already consumed."
            exit 0
          fi
          cat .seed-reference-audit-v2/part-* > /tmp/reference-audit.patch.xz.b64
          base64 --decode /tmp/reference-audit.patch.xz.b64 | xz -dc > /tmp/reference-audit.patch
          git apply --check /tmp/reference-audit.patch
          git apply /tmp/reference-audit.patch
          rm -rf .seed-reference-audit-v2
          rm -f .github/workflows/bootstrap-reference-audit-v2.yml
          rm -f .github/workflows/export-source.yml
          git diff --check
          npm install --no-audit --no-fund --no-package-lock
          npm run check
          npm test
          npm run typecheck
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(reference): audit full video and define fixed-camera asset lineage"
          git push origin HEAD:main
