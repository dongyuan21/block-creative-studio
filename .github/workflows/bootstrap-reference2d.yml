name: Bootstrap reference-first 2D baseline

on:
  push:
    branches: [main]
    paths:
      - '.seed-reference2d/**'
      - '.github/workflows/bootstrap-reference2d.yml'

permissions:
  contents: write

jobs:
  apply-reference2d-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Reconstruct and apply reference-first patch
        shell: bash
        run: |
          set -euo pipefail
          cat .seed-reference2d/part-* > /tmp/reference2d.patch.gz.b64
          base64 --decode /tmp/reference2d.patch.gz.b64 | gzip -dc > /tmp/reference2d.patch
          patch -p4 < /tmp/reference2d.patch
          rm -rf .seed-reference2d
          git diff --check
          npm run check:source
          npm run check:core

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No reference-first source changes to commit."
            exit 0
          fi
          git commit -m "feat: add reference-first 2D baseline"
          git push origin HEAD:main
