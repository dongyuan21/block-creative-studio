name: Bootstrap browser asset store v1

on:
  push:
    paths:
      - .github/workflows/bootstrap-browser-asset-store.yml
      - .seed-browser-asset-store/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-browser-asset-store-v1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Apply, validate and publish
        shell: bash
        env:
          EXPECTED_PATCH_SHA256: aa9a3ecdc2d830864af286cf2b37ee912457f6e327ccce4f66e9fc60d9edd75b
          BASE_SHA: 225c92c960609d15c613197532b28d59192fb5f6
        run: |
          set -euo pipefail

          cat .seed-browser-asset-store/patch.part* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/browser-asset-store.patch
          echo "${EXPECTED_PATCH_SHA256}  /tmp/browser-asset-store.patch" | sha256sum --check -

          git apply --check /tmp/browser-asset-store.patch
          git apply /tmp/browser-asset-store.patch

          # Browser-store tests intentionally import DOM/IndexedDB APIs. Keep the
          # Node CLI contract free of browser runtime dependencies, while giving
          # the test/Vite config enough ambient types to validate browser code.
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          node_config = Path('tsconfig.node.json')
          config = json.loads(node_config.read_text())
          libs = list(config.setdefault('compilerOptions', {}).get('lib', []))
          for lib in ('DOM', 'DOM.Iterable'):
              if lib not in libs:
                  libs.append(lib)
          config['compilerOptions']['lib'] = libs
          node_config.write_text(json.dumps(config, indent=2) + '\n')

          authoring = Path('src/assets/browserAssetAuthoring.ts')
          source = authoring.read_text()
          pattern = re.compile(r'(?P<prefix>(?:export\s+)?type\s+BinaryLike\s*=\s*)(?P<body>[^;]+);')
          match = pattern.search(source)
          if match and 'ArrayBuffer' not in match.group('body'):
              source = pattern.sub(
                  lambda item: f"{item.group('prefix')}{item.group('body').strip()} | ArrayBuffer;",
                  source,
                  count=1,
              )
              authoring.write_text(source)

          closure_test = Path('tests/assetDependencyClosure.test.ts')
          source = closure_test.read_text()
          source = source.replace('plan.dependencyOrder.map(', '(plan.dependencyOrder ?? []).map(')
          closure_test.write_text(source)
          PY

          npm ci --no-audit --no-fund
          npm run check
          npm test
          npm run typecheck
          npm run build

          git show "${BASE_SHA}:.github/workflows/export-source.yml" > .github/workflows/export-source.yml
          rm -rf .seed-browser-asset-store
          rm -f .github/workflows/bootstrap-browser-asset-store.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(assets): add browser binary asset store"
          git push origin "HEAD:${GITHUB_REF_NAME}"
