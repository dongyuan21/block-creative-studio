name: Bootstrap Block Creative Studio source

on:
  push:
    branches: [main]
    paths:
      - '.seed/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/source"
          cat .seed/source.part-* | base64 --decode > "$tmp/source.tar.xz"
          tar -xJf "$tmp/source.tar.xz" -C "$tmp/source"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.seed/' \
            --exclude='.bootstrap' \
            --exclude='.github/workflows/bootstrap.yml' \
            --exclude='.github/workflows/ci.yml' \
            "$tmp/source/" ./
          rm -rf .seed
          rm -f .bootstrap

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: import Block Creative Studio v0.1.4 alpha"
          git push origin HEAD:main
