name: Bootstrap Reference 2D calibration and 3D LookDev

on:
  push:
    paths:
      - .github/workflows/bootstrap-reference2d-lookdev.yml
      - .seed-reference2d-lookdev/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-reference2d-lookdev-v1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Apply, validate and publish
        shell: bash
        env:
          EXPECTED_PATCH_SHA256: 5be6e16905569c646eb46ea6c11f6944fd526820fe433c1c010e53205b0b2869
          MAIN_BASE_SHA: 68c90820279bf3c16785df80d2ba236be1e8eb5b
        run: |
          set -euo pipefail

          cat .seed-reference2d-lookdev/patch.part* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/reference2d-lookdev.patch
          echo "${EXPECTED_PATCH_SHA256}  /tmp/reference2d-lookdev.patch" | sha256sum --check -

          git apply --check /tmp/reference2d-lookdev.patch
          git apply /tmp/reference2d-lookdev.patch

          npm ci --no-audit --no-fund
          npm run check
          npm test
          npm run typecheck
          npm run build

          # The export workflow was touched only to obtain a source snapshot.
          git show "${MAIN_BASE_SHA}:.github/workflows/export-source.yml" > .github/workflows/export-source.yml
          rm -rf .seed-reference2d-lookdev
          rm -f .github/workflows/bootstrap-reference2d-lookdev.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Reference 2D calibration and 3D LookDev"
          git push origin "HEAD:${GITHUB_REF_NAME}"
