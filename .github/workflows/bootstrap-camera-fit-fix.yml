name: Bootstrap experimental 3D camera fit fix

on:
  push:
    paths:
      - .github/workflows/bootstrap-camera-fit-fix.yml
      - .seed-camera-fit-fix/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-camera-fit-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Apply camera framing fix, validate, and publish
        shell: bash
        run: |
          set -euo pipefail
          PATCH_FILE=.seed-camera-fit-fix/camera-fit.patch
          git apply --check "$PATCH_FILE"
          git apply "$PATCH_FILE"
          rm -rf .seed-camera-fit-fix
          rm -f .github/workflows/bootstrap-camera-fit-fix.yml

          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run typecheck
          npm run build

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(renderer): fit experimental 3D camera to portrait viewport"
          git push origin HEAD:main
