name: export-source

on:
  push:
    paths:
      - .github/workflows/export-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source tree
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/block-creative-studio-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: block-creative-studio-source
          path: /tmp/block-creative-studio-source.tar.gz
          if-no-files-found: error
          retention-days: 1
