name: Bootstrap headless core v1

on:
  push:
    paths:
      - .github/workflows/bootstrap-headless-core-v1.yml
      - .seed-headless-core-v1/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-headless-core-v1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Apply Headless Core, validate, and publish
        shell: bash
        run: |
          set -euo pipefail
          cat .seed-headless-core-v1/part-* > /tmp/headless.patch.xz.b64
          echo "d86988de900db913f6bb8336cd6f1450d19b238c98862e8a4f421905c4750329  /tmp/headless.patch.xz.b64" | sha256sum --check --strict
          base64 --decode /tmp/headless.patch.xz.b64 | xz -dc > /tmp/headless.patch
          echo "41671a3f79b8b481ea60a7b787851ee350bf9561ebe8da2bcec3db43a8eea80a  /tmp/headless.patch" | sha256sum --check --strict
          git apply --check /tmp/headless.patch
          git apply /tmp/headless.patch
          rm -rf .seed-headless-core-v1
          rm -f .github/workflows/bootstrap-headless-core-v1.yml

          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run typecheck
          npm run build

          node dist-cli/cli/bcs.js capabilities > /tmp/capabilities.json
          node dist-cli/cli/bcs.js asset validate examples/headless/assets/material.copper.json > /tmp/asset-validation.json
          node dist-cli/cli/bcs.js variant compile \
            --master examples/headless/master.demo.json \
            --recipe examples/headless/variant.copper.demo.json \
            --assets examples/headless/assets \
            --renderer fixed-camera-cinematic \
            --require-hashes \
            --out /tmp/copper-plan.json > /tmp/variant-compile.json
          node dist-cli/cli/bcs.js quality check \
            --plan /tmp/copper-plan.json \
            --strict \
            --require-hashes > /tmp/quality-report.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(headless): add Agent-neutral variant compiler and CLI"
          git push origin HEAD:main
