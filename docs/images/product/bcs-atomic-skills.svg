<text x="60" y="79.34" font-size="44" font-weight="700" text-anchor="start" style="fill:#18304D">CLI 是原子能力，Skill 把能力串成任务</text>
<text x="60" y="136" font-size="25" font-weight="400" text-anchor="start" style="fill:#637892">改流程，改 Skill；增加新的执行能力，才扩展 CLI。</text>
<text x="1540" y="65.84" font-size="19" font-weight="700" text-anchor="end" style="fill:#2356B6">能力与流程</text>
<text x="84" y="229.94" font-size="29" font-weight="700" text-anchor="start" style="fill:#754EBA">外部 Agent</text>
<text x="84" y="281.28" font-size="23" font-weight="400" text-anchor="start" style="fill:#18304D">读取、执行、修改 Skill</text>
<text x="489" y="229.94" font-size="29" font-weight="700" text-anchor="start" style="fill:#754EBA">可编辑的制作配方</text>
<text x="489" y="281.28" font-size="23" font-weight="400" text-anchor="start" style="fill:#18304D">使用官方 Skill，也可复制、自写；按任务调整步骤，或插入人工确认。</text>
<text x="62" y="357.28" font-size="23" font-weight="400" text-anchor="start" style="fill:#754EBA">回读 JSON 与错误码 → 继续、停止，或从对应步骤补跑</text>
<text x="86" y="428.22" font-size="27" font-weight="700" text-anchor="start" style="fill:#2356B6">BCS CLI · 每项能力可单独调用，Skill 按任务组合</text>
<text x="177" y="502" font-size="25" font-weight="700" text-anchor="middle" style="fill:#2356B6">出题</text>
<text x="177" y="547.62" font-size="17" font-weight="400" text-anchor="middle" style="fill:#637892">project scaffold</text>
<text x="381" y="502" font-size="25" font-weight="700" text-anchor="middle" style="fill:#2356B6">换局内皮</text>
<text x="381" y="547.62" font-size="17" font-weight="400" text-anchor="middle" style="fill:#637892">skin apply</text>
<text x="585" y="502" font-size="25" font-weight="700" text-anchor="middle" style="fill:#2356B6">机器试玩</text>
<text x="585" y="547.62" font-size="17" font-weight="400" text-anchor="middle" style="fill:#637892">agent run</text>
<text x="789" y="502" font-size="25" font-weight="700" text-anchor="middle" style="fill:#2356B6">校验 Take</text>
<text x="789" y="547.62" font-size="17" font-weight="400" text-anchor="middle" style="fill:#637892">take validate</text>
<text x="993" y="502" font-size="25" font-weight="700" text-anchor="middle" style="fill:#2356B6">生成工程</text>
<text x="993" y="547.62" font-size="17" font-weight="400" text-anchor="middle" style="fill:#637892">document emit</text>
<text x="1197" y="502" font-size="25" font-weight="700" text-anchor="middle" style="fill:#2356B6">编译演出</text>
<text x="1197" y="547.62" font-size="17" font-weight="400" text-anchor="middle" style="fill:#637892">document compile</text>
<text x="1401" y="502" font-size="25" font-weight="700" text-anchor="middle" style="fill:#2356B6">渲染视频</text>
<text x="1401" y="547.62" font-size="17" font-weight="400" text-anchor="middle" style="fill:#637892">render</text>
<text x="60" y="659.94" font-size="29" font-weight="700" text-anchor="start" style="fill:#18304D">同一组原子操作，组合出不同的产品任务</text>
<text x="83" y="725.72" font-size="27" font-weight="700" text-anchor="start" style="fill:#2356B6">从出题到出片</text>
<text x="83" y="763.34" font-size="19" font-weight="400" text-anchor="start" style="fill:#637892">bcs-from-puzzle-to-mp4</text>
<text x="593" y="725.72" font-size="27" font-weight="700" text-anchor="start" style="fill:#117C82">一盘玩法，多套皮</text>
<text x="593" y="763.34" font-size="19" font-weight="400" text-anchor="start" style="fill:#637892">bcs-remix-looks</text>
<text x="1103" y="725.72" font-size="27" font-weight="700" text-anchor="start" style="fill:#4A7B53">先校验，再出片</text>
<text x="1103" y="763.34" font-size="19" font-weight="400" text-anchor="start" style="fill:#637892">bcs-gate-before-render</text>
<text x="83" y="844.72" font-size="27" font-weight="700" text-anchor="start" style="fill:#C26B08">保留工程，稍后补片</text>
<text x="83" y="882.34" font-size="19" font-weight="400" text-anchor="start" style="fill:#637892">bcs-resume-render</text>
<text x="593" y="844.72" font-size="27" font-weight="700" text-anchor="start" style="fill:#2356B6">资产与 PBR 变体</text>
<text x="593" y="882.34" font-size="19" font-weight="400" text-anchor="start" style="fill:#637892">bcs-placement-variant</text>
<text x="1103" y="844.72" font-size="27" font-weight="700" text-anchor="start" style="fill:#754EBA">按错误码定位下一步</text>
<text x="1103" y="882.34" font-size="19" font-weight="400" text-anchor="start" style="fill:#637892">bcs-diagnose</text>
<text x="800" y="943.42" font-size="22" font-weight="400" text-anchor="middle" style="fill:#637892">另有资产校验、变体编译与质量检查；bcs produce 是便捷入口，不是唯一流水线。</text>
<text x="60" y="980.4" font-size="15" font-weight="400" text-anchor="start" style="fill:#637892">BCS · 源码 3732a80 · 2026-09-07</text>
<text x="1540" y="980.4" font-size="15" font-weight="400" text-anchor="end" style="fill:#637892">2/03 · “原子”指职责独立、可组合，不表示数据库事务</text>
</svg>
