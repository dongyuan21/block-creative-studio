<text x="60" y="79.34" font-size="44" font-weight="700" text-anchor="start" style="fill:#18304D">人可创作，Agent 也能直接开工</text>
<text x="60" y="136" font-size="25" font-weight="400" text-anchor="start" style="fill:#637892">BCS 多游戏创意平台 · 可视化工作台 + Skill 驱动的原子操作</text>
<text x="1540" y="65.84" font-size="19" font-weight="700" text-anchor="end" style="fill:#2356B6">产品总览</text>
<text x="84" y="234.3" font-size="30" font-weight="700" text-anchor="start" style="fill:#4A7B53">使用者</text>
<text x="84" y="281.3" font-size="24" font-weight="400" text-anchor="start" style="fill:#18304D">搭建局面 · 试玩回放</text>
<text x="84" y="312.98" font-size="24" font-weight="400" text-anchor="start" style="fill:#18304D">在 Web Studio 调整与审核</text>
<text x="629" y="233.94" font-size="29" font-weight="700" text-anchor="start" style="fill:#754EBA">外部 Agent</text>
<text x="629" y="281.6" font-size="23" font-weight="400" text-anchor="start" style="fill:#18304D">理解任务</text>
<text x="629" y="311.96" font-size="23" font-weight="400" text-anchor="start" style="fill:#18304D">选择或修改配方</text>
<text x="934" y="233.94" font-size="29" font-weight="700" text-anchor="start" style="fill:#754EBA">BCS Skills</text>
<text x="934" y="281.6" font-size="23" font-weight="400" text-anchor="start" style="fill:#18304D">官方组合配方</text>
<text x="934" y="311.96" font-size="23" font-weight="400" text-anchor="start" style="fill:#18304D">也可复制、自写</text>
<text x="1249" y="233.94" font-size="29" font-weight="700" text-anchor="start" style="fill:#2356B6">CLI 原子操作</text>
<text x="1249" y="281.6" font-size="23" font-weight="400" text-anchor="start" style="fill:#18304D">独立调用</text>
<text x="1249" y="311.96" font-size="23" font-weight="400" text-anchor="start" style="fill:#18304D">返回 JSON 与错误码</text>
<text x="86" y="468.96" font-size="36" font-weight="700" text-anchor="start" style="fill:#2356B6">Block Creative Studio</text>
<text x="1512" y="467.36" font-size="26" font-weight="700" text-anchor="end" style="fill:#2356B6">多游戏创作 · 共用生产能力</text>
<text x="283" y="380.92" font-size="22" font-weight="400" text-anchor="start" style="fill:#4A7B53">可视化操作</text>
<text x="1365" y="380.56" font-size="21" font-weight="400" text-anchor="end" style="fill:#2356B6">无头调用 · 不依赖手工点界面</text>
<text x="111" y="550.22" font-size="27" font-weight="700" text-anchor="start" style="fill:#2356B6">Block Placement</text>
<text x="111" y="593.56" font-size="21" font-weight="400" text-anchor="start" style="fill:#18304D">方块放置 · 行列消除</text>
<text x="597" y="550.22" font-size="27" font-weight="700" text-anchor="start" style="fill:#2356B6">TapTile Match-3</text>
<text x="597" y="593.56" font-size="21" font-weight="400" text-anchor="start" style="fill:#18304D">分层牌堆 · 7 槽三消</text>
<text x="1083" y="550.22" font-size="27" font-weight="700" text-anchor="start" style="fill:#2356B6">Crush Wooood!</text>
<text x="1083" y="593.56" font-size="21" font-weight="400" text-anchor="start" style="fill:#18304D">纵向落块 · 粉碎坍落</text>
<text x="799" y="666" font-size="25" font-weight="700" text-anchor="middle" style="fill:#117C82">出题与换皮   ·   机器试玩与 Take   ·   导演编译   ·   校验与固定帧渲染</text>
<text x="84" y="815.94" font-size="29" font-weight="700" text-anchor="start" style="fill:#2356B6">工程与玩法记录</text>
<text x="84" y="867.06" font-size="21" font-weight="400" text-anchor="start" style="fill:#18304D">配置 · Take · 可继续编辑的 JSON</text>
<text x="594" y="815.94" font-size="29" font-weight="700" text-anchor="start" style="fill:#C26B08">视频与预览</text>
<text x="594" y="867.06" font-size="21" font-weight="400" text-anchor="start" style="fill:#18304D">由 Chrome / WebCodecs 实际出片</text>
<text x="1104" y="815.94" font-size="29" font-weight="700" text-anchor="start" style="fill:#117C82">结果与诊断</text>
<text x="1104" y="867.06" font-size="21" font-weight="400" text-anchor="start" style="fill:#18304D">机器可读状态 · 校验报告 · 错误码</text>
<text x="800" y="943.86" font-size="26" font-weight="700" text-anchor="middle" style="fill:#18304D">人用界面，Agent 用 Skill 调用 CLI；制作流程可以复用，也可以重新组合。</text>
