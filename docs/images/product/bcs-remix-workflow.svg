<text x="60" y="136" font-size="25" font-weight="400" text-anchor="start" style="fill:#637892">bcs-remix-looks · 试玩一次，复用 Take，按外观分别生成工程与视频</text>
<text x="1540" y="65.84" font-size="19" font-weight="700" text-anchor="end" style="fill:#2356B6">Skill 使用场景</text>
<text x="84" y="237.58" font-size="28" font-weight="700" text-anchor="start" style="fill:#2356B6">01  机器试玩一次</text>
<text x="84" y="291.28" font-size="23" font-weight="400" text-anchor="start" style="fill:#18304D">agent run → 留下 Take</text>
<text x="519" y="237.58" font-size="28" font-weight="700" text-anchor="start" style="fill:#117C82">固定同一份 Take</text>
<text x="519" y="290.92" font-size="22" font-weight="400" text-anchor="start" style="fill:#18304D">操作序列复用 · 不重新试玩</text>
<text x="999" y="237.58" font-size="28" font-weight="700" text-anchor="start" style="fill:#754EBA">02  Agent 执行换皮 Skill</text>
<text x="999" y="291.28" font-size="23" font-weight="400" text-anchor="start" style="fill:#18304D">同一配方，依次应用不同局内皮</text>
